add_newline = true
command_timeout = 200
palette = "zen"
format = """
$directory\
$git_branch\
$git_status\
$aws\
$line_break\
$character"""

[palettes.zen]
accent = "6"
accent-hi = "14"
muted = "15"
info = "4"
success = "2"
warning = "3"
danger = "1"

[character]
error_symbol = "[✗](bold danger)"
success_symbol = "[❯](bold)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = false
style = "dimmed"
repo_root_style = "bold"
repo_root_format = "[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic muted"

[git_status]
format = '(\([$all_status]($style)\) )'
style = "muted"
ahead = "[⇡${count}](warning)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](warning)"
behind = "[⇣${count}](warning)"
conflicted = "[!](bold danger)"
up_to_date = ""
untracked = "[?](accent)"
modified = "[●](accent)"
stashed = ""
staged = ""
renamed = ""
deleted = ""

# ─────────────────────────────────────────────────────────────
# AWS
# ─────────────────────────────────────────────────────────────
[aws]
format = '( [{$symbol($profile )(\($region\) )(\[$duration\])}]($style) )'
symbol = "☁️ "
style = "bold accent"
expiration_symbol = "[⚠️](bold danger)"

[aws.region_aliases]
us-east-1 = "use1"
us-west-2 = "usw2"
eu-west-1 = "euw1"
eu-central-1 = "euc1"
ap-southeast-1 = "apse1"
ap-northeast-1 = "apne1"

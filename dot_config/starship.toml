add_newline = true
command_timeout = 200
format = """
$directory\
$git_branch\
$git_status\
$aws\
$line_break\
$character"""

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = false
repo_root_style = "bold cyan"
repo_root_format = "[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format = '[$all_status]($style)'
style = "cyan"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""

# ─────────────────────────────────────────────────────────────
# AWS
# ─────────────────────────────────────────────────────────────
[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\])]($style)'
symbol = "☁️ "
style = "bold yellow"
expiration_symbol = "⚠️"

[aws.region_aliases]
us-east-1 = "use1"
us-west-2 = "usw2"
eu-west-1 = "euw1"
eu-central-1 = "euc1"
ap-southeast-1 = "apse1"
ap-northeast-1 = "apne1"
